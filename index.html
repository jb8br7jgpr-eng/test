<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091624">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPMercato">
<title>OPMercato — Choisis ton jeu</title>
<link rel="manifest" href="./manifest.webmanifest?v=icone-boussole-20261019-final">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=icone-boussole-20261019-final">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=icone-boussole-20261019-final">
<script>
(function(){
  const p=new URLSearchParams(location.search);
  if(p.has("room")||p.get("game")==="classic"){
    p.delete("game");
    const u=new URL("./classique.html",location.href);
    u.search=p.toString();u.hash=location.hash;
    location.replace(u.href);
  }
})();
</script>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071522}
.launcher{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.choice{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:clamp(7px,1.7vh,17px);padding:15px 18px;overflow:hidden;text-align:center}
.choice--original{padding-top:calc(17px + env(safe-area-inset-top));background:radial-gradient(ellipse at 50% 35%,#20425a 0%,#102a40 48%,#081a2a 100%)}
.choice--fc{padding-bottom:calc(20px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 45%,#152f41 0%,#091b2b 58%,#06101b 100%)}
.choice--fc:before{content:"";position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,#c99a52,transparent)}
.choice>*{position:relative;z-index:1}
.choice-label{margin:0;color:#e9c482;font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(10px,2.65vw,12px)}
.choice-sub{margin:0;color:#aec8d3;font-size:clamp(11px,2.8vw,13px);line-height:1.25}
.choice-logo--classic{display:block;width:min(88vw,345px);height:auto;max-height:clamp(95px,21vh,158px);object-fit:contain;border:1px solid rgba(241,194,109,.68);border-radius:14px;box-shadow:0 14px 36px #0009}
.choice-logo--fc{display:block;width:min(61vw,230px,24vh);aspect-ratio:1;object-fit:contain;border-radius:16px;filter:drop-shadow(0 7px 18px #0009)}
.choice-play{display:flex;align-items:center;justify-content:center;min-width:min(64vw,250px);min-height:49px;padding:12px 32px;background:linear-gradient(145deg,#ffe3a1,#e3aa50);border:1px solid #fff0c6;border-radius:14px;text-decoration:none;color:#172530;font-size:16px;letter-spacing:.07em;font-weight:950;box-shadow:0 9px 23px #0007}
.choice-play:active{transform:translateY(1px)}
.choice-play:focus-visible{outline:3px solid #85ebe2;outline-offset:4px}
@media(max-height:640px){.choice{gap:6px}.choice-logo--classic{max-height:100px}.choice-logo--fc{width:min(43vw,155px,22vh)}.choice-play{min-height:43px;padding:9px 26px}}
@media(min-width:850px){.launcher{max-width:670px;margin:auto;box-shadow:0 0 80px #0009}}
</style>
</head>
<body>
<main class="launcher" aria-label="Choisis ton mode de jeu">
<section class="choice choice--original" aria-labelledby="original-name">
<p class="choice-label" id="original-name">OPMercato classique</p>
<img class="choice-logo--classic" src="./opmercato-logo.jpg" alt="Logo original d'OPMercato" decoding="async">
<p class="choice-sub">Le mercato des pirates</p>
<a class="choice-play" href="./classique.html">JOUER</a>
</section>
<section class="choice choice--fc" aria-labelledby="fc-name">
<p class="choice-label" id="fc-name">OPMercato FC</p>
<img class="choice-logo--fc" src="./opfc-logo.webp" alt="Logo officiel d'OPMercato FC" decoding="async">
<p class="choice-sub">Le Classique de Grand Line</p>
<a class="choice-play" href="./opfc.html">JOUER</a>
</section>
</main>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=icon-20261019-2").catch(()=>{}));
}
</script>
</body>
</html>
