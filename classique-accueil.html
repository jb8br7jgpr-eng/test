<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081823">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPMercato">
<title>OPMercato — Choisis ton mode de jeu</title>
<link rel="manifest" href="./manifest.webmanifest?v=icone-boussole-20261019-final">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=icone-boussole-20261019-final">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=icone-boussole-20261019-final">
<style>
:root{color-scheme:dark;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#f6f7f2;background:#081823}
*{box-sizing:border-box}
html{min-width:320px}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse 85% 54% at 50% 37%,#275066 0%,#102d3e 50%,#081823 100%);color:#f6f7f2}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid #8ce9d8;outline-offset:4px}
.home{max-width:630px;width:100%;min-height:100vh;min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) clamp(13px,4.2vw,24px) calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;align-items:stretch;gap:clamp(9px,1.5dvh,16px)}
.home-header{position:relative;flex:0 0 auto;display:flex;align-items:center;flex-direction:column;gap:5px}
.home-back{align-self:flex-start;display:inline-block;border:1px solid #d8b7775e;background:#102e40b0;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800;color:#f7d6a4}
.home-logo{display:block;width:min(91%,360px);height:clamp(86px,15dvh,143px);object-fit:contain;object-position:center;filter:drop-shadow(0 7px 13px #0009)}
.home-title{margin:0;text-align:center;font-size:11px;font-weight:900;letter-spacing:.19em;color:#f1cf97;text-transform:uppercase}
.home-art{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:180px;max-height:540px;padding:0 1px;isolation:isolate}
.home-art:before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:11%;bottom:9%;border-radius:50%;background:radial-gradient(circle,#57b2ba2b,transparent 71%);pointer-events:none}
.home-art img{display:block;width:min(100%,490px);max-height:100%;height:auto;object-fit:contain;object-position:center;filter:drop-shadow(0 12px 15px #0009)}
.home-actions{display:grid;gap:10px;flex:0 0 auto}
.mode-action{display:flex;align-items:center;justify-content:space-between;gap:13px;min-height:clamp(65px,8.4dvh,82px);border:1px solid #d6ac668b;border-radius:17px;padding:11px 16px;background:linear-gradient(120deg,#f8dc9a,#d9a451);color:#152735;box-shadow:0 8px 18px #0008}
.mode-action.online{border-color:#7edac8a3;background:linear-gradient(125deg,#235f6b,#174254);color:#f6fbfc}
.mode-icon{font-size:29px;line-height:1;flex:0 0 34px;text-align:center}
.mode-text{display:flex;flex:1;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.mode-text strong{font-size:clamp(16px,4.5vw,19px);font-weight:950;line-height:1.15}
.mode-text small{font-size:11px;font-weight:650;opacity:.79;line-height:1.3}
.mode-chevron{font-size:29px;opacity:.8}
.home-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:0 0 auto}
.shortcut{min-height:clamp(49px,6.4dvh,61px);display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #d9c28b72;border-radius:13px;background:#183b4ddb;color:#f4dcac;font-size:clamp(12px,3.5vw,15px);font-weight:950;letter-spacing:.035em;text-align:center}
.shortcut span{font-size:19px;line-height:1}
.mode-action:active,.shortcut:active{transform:translateY(1px);filter:brightness(1.09)}
@media(min-width:700px){body{box-shadow:inset 0 0 70px #0005}.home{box-shadow:0 0 60px #0005}}
@media(max-height:700px){.home{gap:7px}.home-logo{height:clamp(73px,13dvh,105px)}.home-art{min-height:130px}.mode-action{min-height:61px;padding:8px 13px}.home-shortcuts .shortcut{min-height:45px}}
@media(prefers-reduced-motion:reduce){.mode-action,.shortcut{transition:none}}
</style>
</head>
<body>
<main class="home" aria-label="Accueil OPMercato">
  <header class="home-header">
    <a class="home-back" href="./">← Choix des jeux</a>
    <img class="home-logo" src="./opmercato-logo-hd.PNG" alt="Logo officiel OPMercato" width="360" height="160" decoding="async">
    <h1 class="home-title">Le mercato des pirates</h1>
  </header>
  <div class="home-art">
    <img src="./opmercato-accueil-equipage.PNG" alt="L'équipage du Chapeau de Paille joue aux cartes : Zoro et Sanji se disputent tandis que Luffy mange et rit" width="1240" height="1240" decoding="async" fetchpriority="high">
  </div>
  <nav class="home-actions" aria-label="Modes de jeu">
    <a class="mode-action" href="./classique.html">
      <span class="mode-icon" aria-hidden="true">⚓</span>
      <span class="mode-text"><strong>Jouer en local</strong><small>À plusieurs sur le même téléphone</small></span>
      <span class="mode-chevron" aria-hidden="true">›</span>
    </a>
    <a class="mode-action online" href="./classique.html?launch=online">
      <span class="mode-icon" aria-hidden="true">🌐</span>
      <span class="mode-text"><strong>Jouer en ligne</strong><small>Sur plusieurs téléphones · Salon privé</small></span>
      <span class="mode-chevron" aria-hidden="true">›</span>
    </a>
    <div class="home-shortcuts" aria-label="Découvrir le jeu">
      <a class="shortcut" href="./classique.html?launch=catalog"><span aria-hidden="true">📚</span>Catalogue</a>
      <a class="shortcut" href="./classique.html?launch=rules"><span aria-hidden="true">📖</span>Règles</a>
    </div>
  </nav>
</main>
</body>
</html>
