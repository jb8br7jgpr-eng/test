<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPMercato">
<link rel="manifest" href="./manifest.webmanifest?v=20261019-icone2"><link rel="apple-touch-icon" sizes="180x180" href="./icone-iphone-boussole-20261019.png?v=20261019-icone2">
<title>OPMercato FC — Accueil</title>
<style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#f8f7f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#1b3b50,#081a2c 57%,#050e1a);padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 22px)}
main{max-width:560px;margin:auto;min-height:calc(100dvh - 85px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
.back{position:absolute;top:calc(env(safe-area-inset-top) + 17px);left:18px;color:#ffe1a1;text-decoration:none;font-size:13px;font-weight:800;padding:10px 13px;border:1px solid #997b4d70;border-radius:12px}
img{display:block;max-width:min(77vw,310px);width:100%;height:auto;border-radius:14px;filter:drop-shadow(0 9px 22px #0008)}
h1{margin:0;color:#f9e6c1;font-size:clamp(20px,6vw,30px)}
p{margin:0;line-height:1.55;color:#b9d0da;font-size:14px}
.status{padding:15px 20px;border:1px solid #d4a9607c;border-radius:17px;background:#143044b0;width:100%;max-width:380px}
.status strong{display:block;margin-bottom:6px;color:#f8e6c4;letter-spacing:.07em;font-size:13px}
.home-button{display:inline-flex;justify-content:center;align-items:center;min-height:50px;width:min(80vw,300px);background:linear-gradient(135deg,#ffe3a1,#e3aa50);color:#162332;text-decoration:none;font-weight:950;border-radius:14px}
a:focus-visible{outline:3px solid #8bf2e1;outline-offset:3px}
</style>
</head>
<body>
<a class="back" href="./">← Choix des jeux</a>
<main>
<img src="./opfc-logo.webp" alt="Logo officiel OPFC">
<h1>Le Classique de Grand Line</h1>
<section class="status"><strong>OPMERCATO FC</strong><p>Le nouveau jeu de football est en préparation. Son mercato et ses matchs arriveront ici.</p></section>
<a class="home-button" href="./">Retour à l'accueil</a>
</main>
</body>
</html>
