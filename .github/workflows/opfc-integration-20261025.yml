name: OPFC — validation branche intégration (sans déploiement)
on:
  push:
    branches:
      - opfc-integration-20261025
      - opfc-keeper-hints-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opfc-isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les fichiers OPFC uniquement
        run: |
          node --check opfc/shot.mjs
          node --check opfc/rematch.mjs
          node --check opfc/match-actions.mjs
          node --check opfc/ui-match-widgets.mjs
          node --check opfc/ui-match.mjs
          node --check opfc/ui.mjs
          node --check opfc/online-match.mjs
          node --check opfc/online-client.mjs
          node --check opfc/ui-online-game.mjs
          node --check supabase/functions/opfc-online/opfc/rematch.mjs
          node --check supabase/functions/opfc-online/opfc/shot.mjs
          node --check supabase/functions/opfc-online/opfc/online-match.mjs
      - name: Tests existants et nouvelle régression OPFC
        run: |
          node --test opfc/tests/v2.test.mjs opfc/tests/integration-20261025.test.mjs opfc/tests/rematch-lifecycle-20261025.test.mjs
          node --test tests/opfc-v2.test.mjs tests/opfc-v2-catalog-sort.test.mjs tests/opfc-v2-offline-queue.test.mjs tests/opfc-v2-edge-bundle.test.mjs
          node --test tests/opfc-match-balance-v4.test.mjs tests/opfc-v3.test.mjs tests/opfc-v3-visual.test.mjs
