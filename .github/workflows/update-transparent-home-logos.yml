name: Installer les logos transparents de l'accueil
on:
  push:
    paths:
      - '.github/workflows/update-transparent-home-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Préparer les deux logos PNG transparents sans recompression avec perte
        run: |
          python -m pip install --quiet pillow numpy opencv-python-headless
          python - <<'PY'
          from PIL import Image
          import numpy as np
          import cv2

          def remove_background(src, dst, mode):
              im=Image.open(src).convert('RGB')
              pixels=np.asarray(im).copy()
              h,w=pixels.shape[:2]
              mask=np.full((h,w),cv2.GC_PR_FGD,dtype=np.uint8)
              if mode=='white':
                  dark=pixels.min(axis=2)
                  mask[dark>248]=cv2.GC_BGD
                  near_white=(dark>228)&((pixels.max(axis=2)-dark)<22)
                  mask[near_white]=cv2.GC_PR_BGD
                  strong_fg=(dark<105)|((pixels.max(axis=2)-dark)>75)
                  mask[strong_fg]=cv2.GC_FGD
              else:
                  n=max(2,min(h,w)//18)
                  corners=np.concatenate((pixels[:n,:n].reshape(-1,3),pixels[-n:,-n:].reshape(-1,3)))
                  bg=np.median(corners,axis=0)
                  delta=np.linalg.norm(pixels.astype(np.float32)-bg.astype(np.float32),axis=2)
                  mask[delta<55]=cv2.GC_PR_BGD
                  mask[delta<18]=cv2.GC_BGD
                  obvious_fg=(pixels[:,:,0]>70)&((pixels[:,:,0]>pixels[:,:,2]*.8)|(pixels[:,:,1]>110))
                  mask[obvious_fg]=cv2.GC_FGD
                  n=max(3,min(h,w)//60)
                  mask[:n,:]=cv2.GC_BGD;mask[-n:,:]=cv2.GC_BGD
                  mask[:,:n]=cv2.GC_BGD;mask[:,-n:]=cv2.GC_BGD
              bg_model=np.zeros((1,65),np.float64)
              fg_model=np.zeros((1,65),np.float64)
              cv2.grabCut(cv2.cvtColor(pixels,cv2.COLOR_RGB2BGR),
                          mask,None,bg_model,fg_model,4,cv2.GC_INIT_WITH_MASK)
              alpha=np.where(np.isin(mask,[cv2.GC_FGD,cv2.GC_PR_FGD]),255,0).astype('uint8')
              alpha=cv2.GaussianBlur(alpha,(3,3),0.55)
              Image.fromarray(np.dstack((pixels,alpha)),'RGBA').save(dst,optimize=True)
              if Image.open(dst).getextrema()[3]!=(0,255):
                  raise RuntimeError('Le fond transparent n’a pas été créé pour '+dst)

          remove_background('opmercato-logo.jpg','opmercato-logo-transparent.png','white')
          remove_background('opfc-logo.webp','opfc-logo-transparent.png','navy')
          print('Deux PNG transparents créés et vérifiés.')
          PY
      - name: Installer les fichiers d'accueil et mettre à jour le cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert 'src="./opmercato-logo.jpg"' in s and 'src="./opfc-logo.webp"' in s
          s=s.replace('src="./opmercato-logo.jpg"','src="./opmercato-logo-transparent.png"')
          s=s.replace('src="./opfc-logo.webp"','src="./opfc-logo-transparent.png"')
          s=s.replace('border:1px solid rgba(241,194,109,.68);border-radius:14px;', 'border:0;border-radius:0;')
          s=s.replace('box-shadow:0 14px 36px #0009}', 'filter:drop-shadow(0 12px 25px #0007)}')
          s=s.replace('launcher-20261019-icon2','launcher-20261019-transparent-1')
          s=s.replace('icon-20261019-2','launcher-20261019-transparent-1')
          p.write_text(s)
          sw=Path('sw.js')
          t=sw.read_text()
          import re
          t,count=re.subn(r"const CACHE = '[^']+';", "const CACHE = 'opmercato-shell-v55-transparent-home-logos';", t,count=1)
          assert count==1 and '"./opfc-logo.webp"' in t
          t=t.replace('"./opfc-logo.webp"', '"./opfc-logo.webp","./opmercato-logo-transparent.png","./opfc-logo-transparent.png"')
          sw.write_text(t)
          PY
      - name: Publier le résultat atomiquement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js opmercato-logo-transparent.png opfc-logo-transparent.png
          git diff --cached --check
          git commit -m "Afficher les logos transparents sur l'accueil commun"
          git push origin HEAD:main
