name: OPMercato Two-Phone Browser Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/opmercato-browser-test.yml'
      - 'mercato-online.js'
      - 'mercato-features.js'
      - 'index.html'
jobs:
  two-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install test browser client
        run: npm install --no-save playwright-core@1.57.0
      - name: Serve checked-out OPMercato locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/opmercato-static.log 2>&1 &
          sleep 2
      - name: Exercise both simulated phones
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "playwright-core";
          const browser=await chromium.launch({executablePath:process.env.CHROME_BINARY,headless:true,args:["--no-sandbox"]});
          const errors=[];
          function listen(page,title){
            page.on("pageerror",e=>errors.push(title+": "+String(e)));
            page.on("console",m=>{if(m.type()==="error"&&/mercato-online|Uncaught/i.test(m.text())) errors.push(title+": "+m.text());});
          }
          const ctx1=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
          const ctx2=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
          const host=await ctx1.newPage(),guest=await ctx2.newPage();
          listen(host,"host");listen(guest,"guest");
          const home="http://127.0.0.1:8765/?v=online-browser";
          try {
            await host.goto(home,{waitUntil:"domcontentloaded",timeout:60000});
            await host.locator('[data-online="open"]').waitFor({timeout:45000});
            await host.locator('[data-online="open"]').click();
            await host.locator('[data-online="create-form"]').click();
            await host.locator('#online-name').fill("Capitaine Test");
            await host.locator('#online-team').fill("5");
            await host.locator('[data-online="create-go"]').click();
            try { await host.locator('.online-code').waitFor({timeout:16000}); }
            catch(e) {
              console.error("CREATE DEBUG notice:", await host.locator('#online-notice').allTextContents());
              console.error("CREATE DEBUG pageerrors:", errors);
              console.error("CREATE DEBUG body:", (await host.locator('#opmercato-online').innerText()).slice(0,1400));
              throw e;
            }
            const code=(await host.locator(".online-code").innerText()).trim();
            if(!/^[A-Z2-9]{8}$/.test(code))throw Error("Code is malformed: "+code);
            await guest.goto(home+"&room="+code,{waitUntil:"domcontentloaded",timeout:60000});
            await guest.locator('[data-online="join-go"]').waitFor({timeout:30000});
            await guest.locator('#online-name').fill("Navigatrice Test");
            await guest.locator('[data-online="join-go"]').click();
            await guest.locator(".online-people").getByText("Capitaine Test").waitFor({timeout:30000});
            await host.locator(".online-people").getByText("Navigatrice Test").waitFor({timeout:30000});
            await host.locator('[data-online="start"]').click();
            await Promise.all([host.locator(".online-round").waitFor({timeout:30000}),
              guest.locator(".online-round").waitFor({timeout:30000})]);
            // The affiliation bonuses must use the same progressive scale in local games.
            const localBonuses=await host.evaluate(()=>{
              const points=ids=>getScore({roster:ids})-ids.reduce((sum,id)=>sum+(CARDS[id]?.power||0),0);
              return {
                one:points(["luffy"]),
                two:points(["luffy","zoro"]),
                three:points(["luffy","zoro","sanji"]),
                four:points(["luffy","zoro","sanji","robin"]),
                five:points(["luffy","zoro","sanji","robin","nami"]),
                six:points(["luffy","zoro","sanji","robin","nami","usopp"]),
                mixed:points(["luffy","zoro","sanji","akainu","kizaru"]),
                legendary:points(["roger","rayleigh","gaban"])
              };
            });
            const expectedBonuses={one:0,two:10,three:20,four:30,five:50,six:50,mixed:30,legendary:20};
            if(JSON.stringify(localBonuses)!==JSON.stringify(expectedBonuses))
              throw Error("Local affiliation score mismatched: "+JSON.stringify(localBonuses));
            // Real local-vs-online parity: same catalogue, personalized art, and detail modal.
            await host.locator('[data-online="catalog"]').click();
            await host.locator('#catalog-search').fill('Joy Boy');
            const art=host.locator('#catalog-results img[data-portrait-id="joyboy"]').first();
            await art.waitFor({timeout:10000});
            await host.waitForFunction(()=>{const x=document.querySelector('#catalog-results img[data-portrait-id="joyboy"]');return x&&x.complete&&x.naturalWidth>0&&x.classList.contains('loaded');},null,{timeout:10000});
            await host.locator('#catalog-results [data-action="details"]').first().click();
            await host.locator('.detail-modal img[data-portrait-id="joyboy"]').waitFor({timeout:10000});
            await host.waitForFunction(()=>document.querySelector('.detail-modal img[data-portrait-id="joyboy"]')?.naturalWidth>0,null,{timeout:10000});
            await host.locator('.detail-modal [data-action="close-modal"]').click();
            await host.locator('[data-online="rules"]').click();
            if(!await host.locator('.modal-content').getByText('Regles du mercato').count())throw Error("Online rules inaccessible");
            await host.locator('.modal-content [data-action="close-modal"]').click();
            // Accept surprises scheduled for different rounds. Their timing is no longer fixed.
            const diceVisible=await host.locator('[data-online="roll"]').count();
            if(diceVisible){
              await host.locator('[data-online="roll"]').click();
              await guest.locator('[data-online="roll"]').click();
              await host.locator('.online-turn').getByText("AU TOUR DE").waitFor({timeout:30000});
            }
            const turn=(await host.locator(".online-turn b").first().innerText()).trim();
            const first=turn==="Capitaine Test"?host:guest,other=turn==="Capitaine Test"?guest:host;
            await first.locator('[data-online="haki"]').click();
            await host.locator(".online-winner").waitFor({timeout:30000});
            await guest.locator(".online-winner").waitFor({timeout:30000});
            if(await other.locator('[data-online="haki"]').count())throw Error("Haki is still active on other phone");
            await host.locator('[data-online="next"]').click();
            await host.locator('.online-round').getByText("ENCHÈRE N° 2").waitFor({timeout:30000});
            await guest.locator('.online-round').getByText("ENCHÈRE N° 2").waitFor({timeout:30000});
            const hostMystery=await host.locator('.online-rank').count();
            const guestMystery=await guest.locator('.online-rank').count();
            if(Boolean(hostMystery)!==Boolean(guestMystery))
              throw Error("Mystery identity isn't synchronized between phones");
            if(hostMystery&&(!await host.locator('.online-mystery').count()||!await guest.locator('.online-mystery').count()))
              throw Error("Mystery picture was disclosed on an active auction");
            // Validate the same random scheduling in the local implementation.
            const localContext=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const local=await localContext.newPage();
            listen(local,"local");
            const specialRounds=new Set(),secretRounds=new Set();
            for(let i=0;i<8;i++){
              await local.goto(home+"&local-sample="+i,{waitUntil:"domcontentloaded",timeout:30000});
              await local.locator('#team-size').fill("5");
              await local.locator('[data-action="start"]').click();
              const plan=await local.evaluate(()=>{
                const state=JSON.parse(localStorage.getItem('mercato-pirates-v1'));
                if(!state?.featureConfig)throw Error("Local surprises missing");
                return state.featureConfig;
              });
              if(plan.eventRound===plan.mysteryRound||
                plan.eventType==='war'&&plan.mysteryRound===plan.eventRound+1)
                throw Error("Local event and mystery overlapped");
              if(plan.eventRound<2||plan.mysteryRound<2)
                throw Error("Local events should be scattered after the opening turn");
              specialRounds.add(plan.eventRound);secretRounds.add(plan.mysteryRound);
              await local.evaluate(()=>localStorage.removeItem('mercato-pirates-v1'));
            }
            await localContext.close();
            if(specialRounds.size<2||secretRounds.size<2)
              throw Error("Local event scheduling is deterministic");
            if(errors.length)throw Error("Browser script errors: "+errors.slice(0,3).join("; "));
            console.log("PASS: two phones, images, Haki, synchronized mysteries, varied local event and mystery schedules.");
          } finally {await browser.close();}
          JS