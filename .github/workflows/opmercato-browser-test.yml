name: OPMercato Two-Phone Browser Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/opmercato-browser-test.yml'
      - 'mercato-online.js'
      - 'mercato-features.js'
      - 'index.html'
      - 'characters-data.js'
      - 'opmercato-catalog.json'
      - 'portrait-map.js'
      - 'sw.js'
jobs:
  two-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check mercato-features.js && node --check mercato-online.js && node --check mercato-rules.js
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install test browser client
        run: npm install --no-save playwright-core@1.57.0
      - name: Serve checked-out OPMercato locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/opmercato-static.log 2>&1 &
          sleep 2
      - name: Exercise both simulated phones
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "playwright-core";
          import { readFileSync } from "node:fs";
          const publishedCatalog=JSON.parse(readFileSync("opmercato-catalog.json","utf8")).characters;
          const browser=await chromium.launch({executablePath:process.env.CHROME_BINARY,headless:true,args:["--no-sandbox"]});
          const errors=[];
          function listen(page,title){
            page.on("pageerror",e=>errors.push(title+": "+String(e)));
            page.on("console",m=>{if(m.type()==="error"&&/mercato-online|Uncaught/i.test(m.text())) errors.push(title+": "+m.text());});
          }
          const ctx1=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
          const ctx2=await browser.newContext({viewport:{width:440,height:956},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const host=await ctx1.newPage(),guest=await ctx2.newPage();
          listen(host,"host");listen(guest,"guest");
          const home="http://127.0.0.1:8765/?v=online-browser";
          try {
            await host.goto(home,{waitUntil:"domcontentloaded",timeout:60000});
            // Catalogue et jeu local doivent partager TOUTES les puissances et le nombre de personnages.
            const active=await host.evaluate(ids=>({
              count:window.OPMERCATO_SHARED.catalogCount(),
              cards:ids.map(id=>({id,power:CARDS[id]?.power,name:CARDS[id]?.name}))
            }),publishedCatalog.map(c=>c.id));
            if(active.count!==publishedCatalog.length)throw Error("Visible roster differs from published catalogue: "+active.count+" vs "+publishedCatalog.length);
            const conflicts=publishedCatalog.filter((c,i)=>active.cards[i].power!==c.power||active.cards[i].name!==c.name);
            if(conflicts.length)throw Error("Local powers/names differ from published catalogue: "+JSON.stringify(conflicts.slice(0,10)));
            await host.locator('[data-online="open"]').waitFor({timeout:45000});
            await host.locator('[data-online="open"]').click();
            await host.locator('[data-online="create-form"]').click();
            await host.locator('#online-name').fill("Capitaine Test");
            await host.locator('#online-team').fill("5");
            await host.locator('[data-online="create-go"]').click();
            try { await host.locator('.online-code').waitFor({timeout:16000}); }
            catch(e) {
              console.error("CREATE DEBUG notice:", await host.locator('#online-notice').allTextContents());
              console.error("CREATE DEBUG pageerrors:", errors);
              console.error("CREATE DEBUG body:", (await host.locator('#opmercato-online').innerText()).slice(0,1400));
              throw e;
            }
            const code=(await host.locator(".online-code").innerText()).trim();
            if(!/^[A-Z2-9]{8}$/.test(code))throw Error("Code is malformed: "+code);
            await guest.goto(home+"&room="+code,{waitUntil:"domcontentloaded",timeout:60000});
            await guest.locator('[data-online="join-go"]').waitFor({timeout:30000});
            await guest.locator('#online-name').fill("Navigatrice Test");
            await guest.locator('[data-online="join-go"]').click();
            await guest.locator(".online-people").getByText("Capitaine Test").waitFor({timeout:30000});
            await host.locator(".online-people").getByText("Navigatrice Test").waitFor({timeout:30000});
            await host.locator('[data-online="start"]').click();
            await Promise.all([host.locator(".online-round").waitFor({timeout:30000}),
              guest.locator(".online-round").waitFor({timeout:30000})]);
            // Le bandeau doit rester visible sous la zone de statut, même sur grand iPhone.
            const hud=await guest.evaluate(async()=>{
              const scroller=document.querySelector('#opmercato-online');
              scroller.scrollTop=480;
              await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
              const item=document.querySelector('.op21-live-hud');
              return {scroll:scroller.scrollTop,top:item.getBoundingClientRect().top,inset:parseFloat(getComputedStyle(item).top)};
            });
            if(hud.scroll<100||hud.inset<8||hud.top<hud.inset-2)
              throw Error('iPhone sticky budget bar overlaps top of viewport: '+JSON.stringify(hud));
            await guest.evaluate(()=>document.querySelector('#opmercato-online').scrollTop=0);
            // Regression: 251 personnages, Luffy et Gear 5 distincts, nouveaux portraits et doublon retiré.
            const roster251=await host.evaluate(()=>({
              visible:window.OPMERCATO_SHARED.catalogCount(),
              luffy:CARDS.luffy?.power,gear5:CARDS['luffy-gear5']?.power,
              kuma:CARDS['kuma-king'],
              newIds:['dorry','brogy','judge','reiju','ichiji','niji','yonji','cracker','oven','daifuku','pekoms','tamago','little-oars-jr','oars','inazuma','guernica','emeth','hannyabal','fukaboshi','wadatsumi','pudding','brulee','morgans','crocus','kureha','hiriluk','tonoyasu','otohime','luffy-gear5'].every(id=>Boolean(CARDS[id]&&window.MERCATO_IMAGE_CARDS[id]?.length))
            }));
            if(roster251.visible!==251||roster251.luffy!==96||roster251.gear5!==100||roster251.kuma||!roster251.newIds)
              throw Error('Local roster/portrait regression: '+JSON.stringify(roster251));
            // The affiliation bonuses must use the same progressive scale in local games.
            const localBonuses=await host.evaluate(()=>{
              const points=ids=>getScore({roster:ids})-ids.reduce((sum,id)=>sum+(CARDS[id]?.power||0),0);
              return {
                one:points(["luffy"]),
                two:points(["luffy","zoro"]),
                three:points(["luffy","zoro","sanji"]),
                four:points(["luffy","zoro","sanji","robin"]),
                five:points(["luffy","zoro","sanji","robin","nami"]),
                six:points(["luffy","zoro","sanji","robin","nami","usopp"]),
                mixed:points(["luffy","zoro","sanji","akainu","kizaru"]),
                legendary:points(["roger","rayleigh","gaban"])
              };
            });
            const expectedBonuses={one:0,two:10,three:20,four:30,five:50,six:50,mixed:30,legendary:20};
            if(JSON.stringify(localBonuses)!==JSON.stringify(expectedBonuses))
              throw Error("Local affiliation score mismatched: "+JSON.stringify(localBonuses)+" errors: "+errors.join("; "));
            // Real local-vs-online parity: same catalogue, personalized art, and detail modal.
            await host.locator('[data-online="catalog"]').click();
            if(!await host.locator('[data-online="catalog"]').count())throw Error('Catalog UI unavailable');
            await host.locator('#catalog-search').fill('Monkey D. Luffy (Gear 5)');
            await host.locator('#catalog-results img[data-portrait-id="luffy-gear5"]').waitFor({timeout:10000});
            await host.locator('#catalog-search').fill('Joy Boy');
            const art=host.locator('#catalog-results img[data-portrait-id="joyboy"]').first();
            await art.waitFor({timeout:10000});
            await host.waitForFunction(()=>{const x=document.querySelector('#catalog-results img[data-portrait-id="joyboy"]');return x&&x.complete&&x.naturalWidth>0&&x.classList.contains('loaded');},null,{timeout:10000});
            await host.locator('#catalog-results [data-action="details"]').first().click();
            await host.locator('.detail-modal img[data-portrait-id="joyboy"]').waitFor({timeout:10000});
            await host.waitForFunction(()=>document.querySelector('.detail-modal img[data-portrait-id="joyboy"]')?.naturalWidth>0,null,{timeout:10000});
            await host.locator('.detail-modal [data-action="close-modal"]').click();
            await host.locator('[data-online="rules"]').click();
            if(!await host.locator('.modal-content').getByText('Regles du mercato').count())throw Error("Online rules inaccessible");
            await host.locator('.modal-content [data-action="close-modal"]').click();
            // La version actuelle propose 8 événements, dont Burst à enchères secrètes.
            const turn=(await host.locator(".online-turn b").first().innerText()).trim();
            const first=turn==="Capitaine Test"?host:guest,other=turn==="Capitaine Test"?guest:host;
            await first.locator('[data-online="haki"]').click();
            await host.locator(".online-winner").waitFor({timeout:30000});
            await guest.locator(".online-winner").waitFor({timeout:30000});
            if(await other.locator('[data-online="haki"]').count())throw Error("Haki still active on other phone");
            // Une recrue à 60 points ou moins propose le Haki de l'Armement
            // au gagnant et bloque la suite tant qu'il n'a pas répondu.
            if(await first.locator('[data-online="armament-skip"]').count()){
              if(await host.locator('[data-online="next"]').isEnabled())
                throw Error("The next round should wait for Armament decision");
              await first.locator('[data-online="armament-skip"]').click();
              await host.waitForFunction(()=>{
                const b=document.querySelector('[data-online="next"]');
                return b && !b.disabled;
              },null,{timeout:30000});
            }
            await host.locator('[data-online="next"]').click();
            // La réponse réseau est asynchrone : attendre le nouveau tour avant de vérifier les étapes.
            await host.waitForFunction(()=>
              !!document.querySelector('.v2-special')||
              (document.querySelector('.online-round')?.textContent||'').includes('ENCHÈRE N° 2')
              ,null,{timeout:30000});
            // Si un événement est annoncé, les deux joueurs doivent le valider.
            if(await host.locator('.v2-special').count()){
              await guest.locator('.v2-special').waitFor({timeout:30000});
              if(!await host.locator('[data-online="event-ready"]').count())
                throw Error("Continue button missing from special event");
              await host.locator('[data-online="event-ready"]').click();
              if(!await host.locator('.v2-special').count())
                throw Error("Event vanished before the other confirmation");
              await guest.locator('[data-online="event-ready"]').click();
              const eventType=await host.locator('.v2-special').getAttribute('class').catch(()=>null);
              // Manage interactive stages without bypassing server-side turns.
              for(let guard=0;guard<8;guard++){
                const next=(await host.locator('#opmercato-online').innerText());
                if(await host.locator('.online-round').count())break;
                if(await host.locator('[data-online="burst-submit"]').count()){
                  await host.locator('#online-burst-amount').fill('5000000');
                  await host.locator('[data-online="burst-submit"]').click();
                  await guest.locator('#online-burst-amount').fill('5000000');
                  await guest.locator('[data-online="burst-submit"]').click();
                  continue;
                }
                if(await host.locator('[data-online="burst-coin"]').count()){
                  await host.locator('[data-online="burst-coin"]').click();
                  await host.locator('.v2-local-fx').waitFor({state:'hidden',timeout:10000}).catch(()=>{});
                  continue;
                }
                if(await host.locator('[data-online="roll"]').count()){
                  const active=await host.locator('[data-online="roll"]').isEnabled();
                  await (active?host:guest).locator('[data-online="roll"]').click();
                  await host.locator('.v2-fx').waitFor({state:'hidden',timeout:10000}).catch(()=>{});
                  continue;
                }
                if(await host.locator('[data-online="coin"]').count()){
                  const active=await host.locator('[data-online="coin"]').isEnabled();
                  await (active?host:guest).locator('[data-online="coin"]').click();
                  await host.locator('.v2-fx').waitFor({state:'hidden',timeout:10000}).catch(()=>{});
                  continue;
                }
                if(await host.locator('[data-online^="pick-"]').count()){
                  const active=await host.locator('[data-online^="pick-"]').first().isEnabled();
                  await (active?host:guest).locator('[data-online^="pick-"]').first().click();
                  continue;
                }
                if(await host.locator('[data-online="event-skip"]').count()||await guest.locator('[data-online="event-skip"]').count()){
                  await (await host.locator('[data-online="event-skip"]').count()?host:guest).locator('[data-online="event-skip"]').click();
                  continue;
                }
                if(await host.locator('[data-online="event-ready"]').count()){
                  await host.locator('[data-online="event-ready"]').click();
                  await guest.locator('[data-online="event-ready"]').click();
                  continue;
                }
                throw Error("Unknown event state: "+next.slice(0,300)+" "+eventType);
              }
            }
            try {
              await host.locator('.online-round').getByText("ENCHÈRE N° 2").waitFor({timeout:30000});
              await guest.locator('.online-round').getByText("ENCHÈRE N° 2").waitFor({timeout:30000});
            } catch(e) {
              console.error("NEXT DEBUG",{
                host:(await host.locator('#opmercato-online').innerText()).slice(0,1000),
                guest:(await guest.locator('#opmercato-online').innerText()).slice(0,1000),
                errors
              });
              throw e;
            }
            const hostMystery=await host.locator('.online-rank').count();
            const guestMystery=await guest.locator('.online-rank').count();
            if(Boolean(hostMystery)!==Boolean(guestMystery))
              throw Error("Mystery identity not synchronized");
            if(hostMystery&&(!await host.locator('.online-mystery').count()||!await guest.locator('.online-mystery').count()))
              throw Error("Mystery identity leaked");
            // Tirages locaux : 1 / 2 / 3 événements sans doublon ni chevauchement.
            const localContext=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const local=await localContext.newPage();
            listen(local,"local");
            const signatures=new Set();
            for(const size of [3,8,10,15]){
              for(let i=0;i<5;i++){
                await local.goto(home+"&sample="+size+"-"+i,{waitUntil:"domcontentloaded",timeout:30000});
                await local.locator('#team-size').fill(String(size));
                await local.locator('[data-action="start"]').click();
                const config=await local.evaluate(()=>{
                  const saved=JSON.parse(localStorage.getItem('mercato-pirates-v1'));
                  return saved?.featureConfig;
                });
                const plan=config?.plan||[];
                const expected=size<=5?1:size<=9?2:3;
                if(plan.length!==expected)throw Error("Incorrect count of events "+size+": "+JSON.stringify(plan));
                if(new Set(plan.map(x=>x.type)).size!==expected)throw Error("Duplicate events");
                const occupied=new Set();
                for(const item of plan){
                  if(occupied.has(item.round))throw Error("Overlapping events");
                  occupied.add(item.round);
                  if(item.type==="war")occupied.add(item.round+1);
                  if(item.type==="smile"&&item.round<=Math.floor(size*2/2))
                    throw Error("SMILE before midgame");
                }
                signatures.add(plan.map(x=>x.type+":"+x.round).join(","));
                await local.evaluate(()=>localStorage.removeItem('mercato-pirates-v1'));
              }
            }
            // Test local déterministe du Coup de Burst avec égalité et pièce animée.
            await local.goto(home+'&burst=local-secret-test',{waitUntil:'domcontentloaded',timeout:30000});
            await local.evaluate(()=>localStorage.removeItem('mercato-pirates-v1'));
            await local.reload({waitUntil:'domcontentloaded'});
            await local.locator('[data-action="start"]').click();
            const burstIntro=await local.evaluate(()=>{
              state.featureConfig.plan=[{type:'burst',round:state.round+1}];
              drawNext();
              return {stage:state.featureConfig.active?.stage,type:state.featureConfig.active?.type,
                id:state.auction?.charId};
            });
            const burstIds=new Set(['luffy','zoro','nami','usopp','sanji','chopper','robin','franky','brook','jinbe','luffy-gear5']);
            if(burstIntro.stage!=='intro'||burstIntro.type!=='burst'||!burstIds.has(burstIntro.id))
              throw Error("Local Burst failed to select an available Straw Hat: "+JSON.stringify(burstIntro));
            if(await local.locator('.v2-burst-card').count())throw Error("Burst card shown before intro");
            await local.locator('[data-action="v2-ready"]').click();
            if(!await local.locator('.v2-burst-card').count())throw Error("Burst character card missing after intro");
            const burstBid=await local.evaluate(()=>String(state.baseBid));
            await local.locator('#v2-burst-amount').fill(burstBid);
            await local.locator('[data-action="v2-burst-offer"]').click();
            const hidden=await local.evaluate(()=>({
              stage:state.featureConfig.active.stage,offers:state.featureConfig.active.offers.length,
              screen:document.querySelector('.v2-local-special')?.innerText||''
            }));
            if(hidden.stage!=='offers'||hidden.offers!==1||hidden.screen.includes('Offres révélées'))
              throw Error("First local Burst bid must stay hidden: "+JSON.stringify(hidden));
            await local.locator('#v2-burst-amount').fill(burstBid);
            await local.locator('[data-action="v2-burst-offer"]').click();
            if(!await local.locator('[data-action="v2-burst-coin"]').count())
              throw Error("Equal secret Burst bids did not trigger a coin toss");
            await local.locator('[data-action="v2-burst-coin"]').click();
            const burstOutcome=await local.evaluate(()=>({
              stage:state.featureConfig.active.stage,
              winner:state.featureConfig.active.winner,
              auction:state.auction.outcome,
              roster:state.players.map(p=>p.roster.includes(state.auction.charId)),
              prices:state.players.map(p=>p.purchases?.[state.auction.charId]||'0')
            }));
            if(burstOutcome.stage!=='result'||burstOutcome.auction!=='sold'||
              burstOutcome.roster.filter(Boolean).length!==1||!burstOutcome.prices.includes(burstBid))
              throw Error("Burst settlement failed: "+JSON.stringify(burstOutcome));
            // Test local déterministe : Rêverie interdit le refus initial, puis autorise le retrait gratuit.
            await local.goto(home+'&reverie=local-regression',{waitUntil:'domcontentloaded',timeout:30000});
            await local.evaluate(()=>localStorage.removeItem('mercato-pirates-v1'));
            await local.reload({waitUntil:'domcontentloaded'});
            await local.locator('[data-action="start"]').click();
            const initialBudgets=await local.evaluate(()=>{
              state.featureConfig.active={type:'reverie',stage:'auction',round:state.round};
              save();render();
              return state.players.map(p=>({budget:Number(p.budget),passes:p.passesUsed}));
            });
            if(!await local.locator('button.pass-btn').isDisabled())
              throw Error('Local Reverie allows withdrawal before first bid');
            await local.locator('button.offer-btn:not([disabled])').first().click();
            if(await local.locator('button.pass-btn').isDisabled())
              throw Error('Local Reverie still blocks withdrawal after first bid');
            await local.locator('button.pass-btn').click();
            const outcome=await local.evaluate(()=>({
              auction:state.auction,players:state.players.map(p=>({budget:Number(p.budget),passes:p.passesUsed}))
            }));
            if(outcome.auction.outcome!=='sold'||outcome.auction.leader===null)
              throw Error('Local Reverie did not settle after withdrawal');
            const win=outcome.auction.leader;
            if(initialBudgets[win].budget-outcome.players[win].budget!==Number(outcome.auction.highBid)*2)
              throw Error('Local Reverie did not charge double');
            if(outcome.players.some((p,i)=>p.passes!==initialBudgets[i].passes))
              throw Error('Local Reverie withdrawal consumed a refusal');
            // Vérifie les vraies animations 3D du dé et de la pièce.
            await local.evaluate(()=>window.OPMERCATO_EVENT_FX("die","Dé : 6",6));
            await local.locator(".v2-dice-cube").waitFor({timeout:5000});
            await local.locator(".v2-local-fx").waitFor({state:"hidden",timeout:6000});
            await local.evaluate(()=>window.OPMERCATO_EVENT_FX("coin","PILE",true));
            await local.locator(".v2-flip-coin").waitFor({timeout:5000});
            await local.locator(".v2-local-fx").waitFor({state:"hidden",timeout:6000});
            await localContext.close();
            if(signatures.size<3)throw Error("Events not randomized");
            if(errors.length)throw Error("Browser script errors: "+errors.slice(0,3).join("; "));
            console.log("PASS: two phones, images, Haki, seven events, synced transitions and randomized local plans.");
          } finally {await browser.close();}
          JS