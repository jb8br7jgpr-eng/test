name: OPFC — fix trajectoires labo V5.1 (sans déploiement)
on:
  push:
    branches:
      - fix/opfc-lab-v5-1-trajectories-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trajectories:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Aucun changement moteur jeu principal, anciens affichages et Supabase
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- opfc.html opfc/ui.mjs opfc/ui-shootout.mjs opfc/ui-match.mjs opfc/penalty-scene.mjs opfc/penalty-scene.css opfc/penalty-lab-core.mjs opfc/penalty-lab-v4.mjs opfc/penalty-lab-v5-1.mjs opfc/penalty-lab-visual.mjs opfc/penalty.mjs opfc/shootout.mjs opfc/match.mjs opfc/ui-final.mjs opfc/ui-match-widgets.mjs supabase
      - name: Syntaxe, coordonnées et préservation des résultats
        run: |
          node --check opfc/penalty-lab-v5-1-flight.mjs
          node --check opfc/penalty-lab.mjs
          node --test opfc/tests/penalty-lab-v5-1-flight.test.mjs opfc/tests/penalty-lab-v5-1.test.mjs opfc/tests/penalty-lab-v4.test.mjs
      - name: Installer navigateur de contrôle iPhone
        run: npm install --no-save playwright-core@1.57.0
      - name: Serveur de branche isolé
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/opfc-v51-trajectories-server.log 2>&1 &
          sleep 2
      - name: Test sur iPhone des trajectoires effectivement dessinées et régressions V4
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node opfc/tests/penalty-lab-v5-1-flight-browser.mjs
          node opfc/tests/penalty-lab-v5-1-browser.mjs
          node opfc/tests/penalty-lab-v4-browser.mjs
      - name: Captures des tirs dans le filet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opfc-lab-v5-1-trajectories-fixed-iphone
          path: |
            /tmp/opfc-v5-1-corrected-goal-*.png
          if-no-files-found: ignore
          retention-days: 7
