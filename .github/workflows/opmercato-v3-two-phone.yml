name: OPMercato V3 Two-Phone Browser Journey
on:
  workflow_dispatch:
  push:
    branches: [main, opmercato-v3-work-20261016, opmercato-v3-polish-20261016, opmercato-v3-visual-fixes-20261016]
    paths: ['.github/workflows/opmercato-v3-two-phone.yml', 'mercato-online.js', 'index.html', 'classique.html']
jobs:
  two-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save playwright-core@1.57.0
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v3-two-phone.log 2>&1 &
      - name: Two independent simulated iPhones against V3 staging backend
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --input-type=module <<'JS'
          import {chromium} from "playwright-core";
          const browser=await chromium.launch({executablePath:process.env.CHROME_BINARY,headless:true,args:["--no-sandbox"]});
          const pages=[],errors=[];
          async function confirmShared(titleHint=""){
            const host=pages[0],guest=pages[1];
            await host.locator('.v3-shared-backdrop').waitFor({timeout:20000});
            await guest.locator('.v3-shared-backdrop').waitFor({timeout:20000});
            const hostText=await host.locator('.v3-shared-notice').innerText();
            const guestText=await guest.locator('.v3-shared-notice').innerText();
            if(hostText!==guestText)throw Error("Shared notices differ between devices: "+hostText+" <> "+guestText);
            if(titleHint&&!hostText.includes(titleHint))throw Error("Unexpected notice: "+hostText);
            await host.locator('[data-online="v3-notice-continue"]').click();
            await host.getByText('En attente des autres pirates', {exact:false}).first().waitFor({timeout:15000});
            if(!await guest.locator('[data-online="v3-notice-continue"]').count())
              throw Error("Guest must still see its own Continue button");
            await guest.locator('[data-online="v3-notice-continue"]').click();
            for(const page of pages)await page.locator('.v3-shared-backdrop').waitFor({state:'hidden',timeout:15000});
            return hostText;
          }
          const live="https://nezqupnhcqwuewfilioa.supabase.co/functions/v1/opmercato-online";
          const staging=live+"-v3-staging";
          async function device(){
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            page.on("pageerror",e=>errors.push(e.stack||e.message));
            await page.route(live,r=>r.continue({url:staging}));
            await page.goto("http://127.0.0.1:8765/classique.html",{waitUntil:"domcontentloaded"});
            pages.push(page);return page;
          }
          try {
            const host=await device(),guest=await device();
            await host.locator('[data-online="open"]').click();
            await host.locator('[data-online="create-form"]').click();
            if(await host.locator('#online-team').inputValue()!=="10")
              throw Error("Online game must default to 10 recruits");
            await host.locator('#online-name').fill("V3 Capitaine");
            await host.locator('#online-team').fill("2");
            await host.locator('[data-online="create-go"]').click();
            await host.locator('.online-code').waitFor({timeout:25000});
            const code=(await host.locator('.online-code').innerText()).trim();
            await guest.locator('[data-online="open"]').click();
            await guest.locator('[data-online="join-form"]').click();
            await guest.locator('#online-code').fill(code);
            await guest.locator('#online-name').fill("V3 Invite");
            await guest.locator('[data-online="join-go"]').click();
            await guest.locator('.online-code').waitFor({timeout:25000});
            await host.locator('[data-online="start"]').click();
            for(const page of pages)await page.locator('[data-online="v3-intro-ready"]').waitFor({timeout:25000});
            for(const page of pages)await page.locator('[data-online="v3-intro-ready"]').click();
            await host.waitForTimeout(1200);
            for(const page of pages){
              try { await page.locator('[data-online="v3-roll"]').waitFor({timeout:20000}); }
              catch(e){
                const ui=await page.locator('.online-shell').innerText();
                console.log("INTRO-TO-DICE DIAGNOSTIC:",ui.slice(0,1800));
                throw e;
              }
            }
            for(const page of pages){
              await page.locator('.op-v3-dice-overlay').waitFor({state:"hidden",timeout:10000});
              await page.locator('[data-online="v3-roll"]:not([disabled])').click();
              await page.locator('.op-v3-dice-overlay').waitFor({state:"hidden",timeout:10000});
            }
            for(let guard=0;guard<40;guard++){
              await host.waitForTimeout(500);
              if(await host.locator('.v3-shared-backdrop').count())await confirmShared();
              if(await host.locator('[data-online^="v3-select-"]').count())break;
              for(const page of pages){
                const button=page.locator('[data-online="v3-roll"]');
                if(await page.locator('.op-v3-dice-overlay').count())continue;
                if(await button.count()&&await button.isEnabled()) {
                  await button.click();
                  await page.locator('.op-v3-dice-overlay').waitFor({state:'hidden',timeout:10000});
                }
              }
            }
            if(!await host.locator('[data-online^="v3-select-"]').count())throw Error("Ship selection did not render");
            for(const id of ["sunny","redforce"]){
              let selectable=null;
              for(let wait=0;wait<35&&!selectable;wait++){
                for(const page of pages){
                  const b=page.locator('[data-online="v3-select-'+id+'"]');
                  if(await b.count()&&await b.isEnabled()){selectable=b;break;}
                }
                if(!selectable)await host.waitForTimeout(350);
              }
              if(!selectable)throw Error("Ship "+id+" cannot be selected even after synchronization");
              await selectable.click();
              await confirmShared('Navire choisi');
              await host.waitForTimeout(300);
            }
            for(const page of pages){
              await page.locator('.online-round').waitFor({timeout:25000});
              const ships=await page.locator(".v3-ship-stamp").count();
              if(ships<2)throw Error("Ship HUD missing on one phone: "+ships);
            }
            if(errors.length)throw Error("Browser exceptions: "+errors.join("\n"));
            const rosterUI=await host.evaluate(()=>{
              const p={id:0,name:"Essai",budget:"10000",roster:["roger","prime-wb"],
                smileModifiers:{roger:-25,"prime-wb":25},shipBonus:{roger:3},
                armamentId:"roger",armamentBonus:20,passesUsed:0};
              const html=window.OPMERCATO_ROSTER_SUMMARY.crew(p,{v3:true,online:true,score:198,losses:[]});
              const team=document.createElement('div');team.className='online-team';
              team.style.maxWidth='340px';team.innerHTML=html;
              document.querySelector('#opmercato-online').appendChild(team);
              const rows=[...team.querySelectorAll('.oprs-character')];
              const bounds=rows.map(el=>el.getBoundingClientRect());
              const outcome={rows:rows.length,negative:team.querySelectorAll('.oprs-negative').length,
                positive:team.querySelectorAll('.oprs-positive').length,
                total:team.querySelector('.oprs-grand-total')?.textContent,
                overlap:bounds.some((el,i)=>i>0&&el.top<bounds[i-1].bottom-2),
                detail:!!rows[0]?.matches('[data-online="details"]')};
              team.remove();return outcome;
            });
            if(rosterUI.rows!==2||rosterUI.negative<1||rosterUI.positive<1||rosterUI.overlap||
              !rosterUI.detail||!rosterUI.total?.includes('198'))
              throw Error("Online iPhone team summary invalid: "+JSON.stringify(rosterUI));
            console.log("PASS two iPhones: lobby, ships, online team effects, no overlap and score breakdown");
          }finally{await browser.close();}
          JS
