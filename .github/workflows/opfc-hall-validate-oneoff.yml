name: OPFC Hall — One-off validation
on:
  push:
    branches:
      - feature/opfc-hall-small-portraits-20261024
    paths:
      - '.github/workflows/opfc-hall-validate-oneoff.yml'
permissions:
  contents: read
jobs:
  test-hall-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax of Hall and catalogue modules
        run: |
          node --check opfc/v3-hall-view.mjs
          node --check opfc/catalog-view.mjs
          node --check opfc/ui.mjs
      - name: Ensure all optimized portraits are present
        run: |
          count=$(find opfc/hall-thumbs -maxdepth 1 -name '*.webp' | wc -l)
          test "$count" -eq 75
          for original in portraits_opfc/*.webp; do test -f "opfc/hall-thumbs/$(basename "$original")"; done
      - name: Verify engine, online server and classic unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- opfc/engine.mjs opfc/match.mjs opfc/match-actions.mjs opfc/player-performance.mjs opfc/open-play.mjs supabase/functions/opfc-online/index.ts classique.html sw.js
      - name: OPFC V2 and V3 regression tests
        run: |
          node --test tests/opfc-v2.test.mjs tests/opfc-v2-catalog-sort.test.mjs tests/opfc-v2-offline-queue.test.mjs tests/opfc-v2-edge-bundle.test.mjs opfc/tests/v2.test.mjs tests/opfc-v3.test.mjs
