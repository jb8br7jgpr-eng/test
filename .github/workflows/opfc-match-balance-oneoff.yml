name: OPFC — Validation équilibre matchs
on:
  push:
    branches:
      - feature/opfc-match-balance-20261025
    paths:
      - '.github/workflows/opfc-match-balance-oneoff.yml'
permissions:
  contents: read
jobs:
  verify-match-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérification syntaxique des moteurs et nouveaux tests
        run: |
          for path in opfc/{rules,open-play,shot,corner,free-kick,penalty}.mjs; do node --check "$path"; done
          for path in supabase/functions/opfc-online/opfc/{rules,open-play,shot,corner,free-kick,penalty}.mjs; do node --check "$path"; done
          node --check tests/opfc-match-balance-v4.test.mjs
      - name: Régressions OPFC complètes et calculs rééquilibrés
        run: node --test tests/*.test.mjs opfc/tests/*.test.mjs
      - name: Aucun changement sur OPMercato classique, catalogue, UI ou statistiques
        run: |
          git diff --exit-code HEAD~1..HEAD -- index.html opmercato-logo.jpg opfc/catalog.mjs opfc/player-performance.mjs opfc/ui.mjs opfc/ui.css
