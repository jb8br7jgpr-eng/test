name: OPMercato Online Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/opmercato-online-test.yml'
      - 'mercato-online.js'
      - 'supabase/functions/opmercato-online/index.ts'
jobs:
  online-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test live multiplayer Edge Function
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const endpoint="https://nezqupnhcqwuewfilioa.supabase.co/functions/v1/opmercato-online";
          const apiKey="sb_publishable_rLlu872lFwupJfFw_f3alw_GhbR7Mok";
          async function request(body,status=200){
            const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","apikey":apiKey},body:JSON.stringify(body)});
            const data=await response.json();
            if(response.status!==status||status===200&&data.error)
              throw Error(body.action+": HTTP "+response.status+" "+JSON.stringify(data).slice(0,500));
            return data;
          }
          async function game(size){
            const created=await request({action:"create",name:"Automated Host",budget:"250000000",teamSize:size,spoilers:true});
            const joined=await request({action:"join",code:created.room.code,name:"Automated Guest"});
            const roomId=created.room.id, tokens=[created.token,joined.token];
            const act=async(seat,action,extra={})=>(await request({action,roomId,token:tokens[seat],...extra})).room;
            const get=async(seat)=>(await request({action:"get",roomId,token:tokens[seat]})).room;
            await request({action:"start",roomId,token:tokens[1]},400);
            let current=await act(0,"start");
            const seen=new Set();
            let paid=0,checks=0;
            while(current.status==="playing"&&checks++<120){
              const a=current.auction,e=current.event.active;
              if(!a)throw Error("No active auction");
              if(e&&!seen.has(e.round)){
                seen.add(e.round);
                const mirrored=await get(1);
                if(mirrored.event.active?.type!==e.type)throw Error("Event not synchronized");
              }
              if(e&&e.stage==="intro"){
                current=await act(0,"event-ready");
                if(current.event.active.stage!=="intro")throw Error("Event vanished without guest confirmation");
                await request({action:"bid",roomId,token:tokens[0],amount:current.baseBid},400);
                current=await act(1,"event-ready");continue;
              }
              if(e&&e.stage==="result"){
                current=await act(0,"event-ready");
                if(current.event.active.stage!=="result")throw Error("Result vanished automatically");
                current=await act(1,"event-ready");continue;
              }
              if(e&&e.stage==="roll"){
                const seat=e.step;
                current=await act(seat,"roll");
                const last=current.event.rolls.at(-1);
                if(last.roll<1||last.roll>6||last.percent!==last.roll*5)throw Error("Die result invalid");
                continue;
              }
              if(e&&e.stage==="coin"){
                const seat=[0,1].find(x=>!e.flips.some(f=>f.id===x));
                current=await act(seat,"coin");
                const last=current.event.active.flips.at(-1);
                if(last.after!==Math.max(0,Math.min(100,last.before+(last.pile?25:-25))))
                  throw Error("SMILE effect invalid");
                continue;
              }
              if(e&&e.stage==="select"){
                const actor=(a.firstTurnId+e.step)%2;
                const chosen=e.choices.find(id=>!e.removed.includes(id));
                current=await act(actor,"event-pick",{charId:chosen});
                if(current.event.active.stage==="auction"&&current.event.active.removed.length!==2)
                  throw Error("Black market must remove two cards");
                continue;
              }
              if(e&&e.stage==="eliminate"){
                const actor=(a.firstTurnId+e.step)%2,opponent=current.players[1-actor];
                current=await act(actor,"event-eliminate",{charId:opponent.roster[0]||""});
                continue;
              }
              if(e&&e.stage!=="auction")throw Error("Unrecognized event stage: "+e.stage);
              if(a.outcome!==null){current=await act(0,"next");continue;}
              if(a.mystery){
                if(a.charId!==null||(await get(1)).auction.charId!==null)
                  throw Error("Mystery character revealed before auction");
              }
              if(e?.type==="reverie"){
                await request({action:"pass",roomId,token:tokens[a.turnId]},400);
                await request({action:"haki",roomId,token:tokens[a.turnId]},400);
              }
              const min=BigInt(a.highBid)>0n?BigInt(a.highBid)+BigInt(current.bidStep):BigInt(current.baseBid);
              const royal=e?.type==="reverie";
              const offered=royal?BigInt(current.initialBudget)/2n:min;
              const bidder=a.turnId;
              const before=BigInt(current.players[bidder].budget);
              current=await act(bidder,"bid",{amount:offered.toString()});
              if(current.auction.outcome===null){
                if(royal)throw Error("Taxed bid should exhaust the other bidder's ability to raise");
                current=await act(current.auction.turnId,"pass");
              }
              if(current.auction.outcome!=="sold")throw Error("Auction failed to settle");
              const winner=current.auction.leader;
              if(winner!==bidder)throw Error("Wrong auction winner");
              const charged=before-BigInt(current.players[bidder].budget);
              const expected=offered*(royal?2n:1n);
              if(charged!==expected)throw Error("Incorrect paid amount "+charged+" expected "+expected);
              paid++;
            }
            if(checks>=120)throw Error("Game did not terminate");
            const expected=size<=5?1:size<=10?2:3;
            if(seen.size!==expected)throw Error("Wrong number of triggered special events: "+size+" -> "+seen.size+" instead of "+expected);
            const final=await get(1);
            if(final.status!=="finished")throw Error("Guest final state not synchronized");
            if(!paid)throw Error("No paid bids recorded");
            console.log("PASS: "+size+" recruits, "+seen.size+" synced events, "+paid+" paid auctions");
          }
          await game(5);
          await game(8);
          await game(11);
          // Multijoueur historique : admissions privees de 4 joueurs.
          const group=await request({action:"create",name:"Player 1",budget:"1000",teamSize:2,maxPlayers:4});
          const groupJoin=async(i)=>request({action:"join",code:group.room.code,name:"Player "+i});
          await groupJoin(2);
          await request({action:"start",roomId:group.room.id,token:group.token},400);
          const third=await groupJoin(3),fourth=await groupJoin(4);
          if(third.room.yourSeat!==2||fourth.room.yourSeat!==3)
            throw Error("Four-player join slots incorrect");
          await request({action:"start",roomId:group.room.id,token:group.token});
          await request({action:"get",roomId:group.room.id,token:"f".repeat(64)},400);
          console.log("PASS: private 4-player sessions, invalid session rejection.");
          JS