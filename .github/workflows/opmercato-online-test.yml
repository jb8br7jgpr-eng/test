name: OPMercato Online Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/opmercato-online-test.yml'
      - 'mercato-online.js'
      - 'supabase/functions/opmercato-online/index.ts'
jobs:
  online-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test live multiplayer Edge Function
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const endpoint="https://nezqupnhcqwuewfilioa.supabase.co/functions/v1/opmercato-online";
          const apiKey="sb_publishable_rLlu872lFwupJfFw_f3alw_GhbR7Mok";
          async function request(body,status=200){
            const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","apikey":apiKey},body:JSON.stringify(body)});
            const data=await response.json();
            if(response.status!==status||status===200&&data.error)
              throw Error(body.action+": HTTP "+response.status+" "+JSON.stringify(data).slice(0,500));
            return data;
          }
          const created=await request({action:"create",name:"Automated Host",budget:"250000000",teamSize:3,spoilers:true});
          const roomId=created.room.id, code=created.room.code, t0=created.token;
          if(!/^[A-Z2-9]{8}$/.test(code))throw Error("invalid room code");
          const joined=await request({action:"join",code,name:"Automated Guest"});
          const t1=joined.token;
          const get=(token)=>request({action:"get",roomId,token});
          const act=(token,action,extra={})=>request({action,roomId,token,...extra});
          const lobby=await get(t0);
          if(lobby.room.players.length!==2)throw Error("Guest did not join");
          await request({action:"start",roomId,token:t1},400);
          const started=await act(t0,"start");
          if(started.room.status!=="playing"||started.room.round!==1)
            throw Error("Game did not start");
          const schedule=started.room.event;
          const eventAt=schedule.eventRound,mysteryAt=schedule.mysteryRound;
          if(eventAt<2||mysteryAt<2||eventAt===mysteryAt||
             schedule.type==="war"&&mysteryAt===eventAt+1)
            throw Error("Event and mystery are not independently scheduled: "+JSON.stringify(schedule));
          if(started.room.event.used||started.room.auction.mystery)
            throw Error("Surprises should not automatically trigger on round 1");
          const actor=started.room.auction.turnId;
          const firstToken=actor===0?t0:t1,otherToken=actor===0?t1:t0;
          await request({action:"haki",roomId,token:otherToken},400);
          const haki=await act(firstToken,"haki");
          if(haki.room.auction.outcome!=="sold"||haki.room.players[actor].roster.length!==1)
            throw Error("Haki failed");
          let sawMystery=false,sawEvent=false,sawWarSecond=false;
          const last=Math.max(eventAt+(schedule.type==="war"?1:0),mysteryAt);
          for(let expectedRound=2;expectedRound<=last;expectedRound++){
            let current=(await act(t0,"next")).room;
            if(current.round!==expectedRound)throw Error("Unexpected round number");
            const mystery=expectedRound===mysteryAt;
            if(Boolean(current.auction.mystery)!==mystery)
              throw Error("Mystery occurred on the wrong round "+expectedRound);
            if(mystery){
              sawMystery=true;
              if(current.auction.charId!==null||(await get(t1)).room.auction.charId!==null)
                throw Error("Mystery leaked to either player's phone");
            }
            const eventNow=expectedRound>=eventAt;
            if(Boolean(current.event.used)!==eventNow)
              throw Error("Event occurred on the wrong round "+expectedRound);
            if(expectedRound===eventAt){
              sawEvent=true;
              if(current.event.type==="marine"&&!current.event.awaitingRolls)
                throw Error("Marine dice were not triggered");
              if(current.event.type==="war"&&current.auction.tier!=="S")
                throw Error("War did not reveal a class S card");
            }
            if(expectedRound===eventAt+1&&current.event.type==="war"){
              sawWarSecond=true;
              if(current.auction.tier!=="S")throw Error("Second war card must be rank S");
            }
            if(current.event.awaitingRolls){
              current=(await act(t0,"roll")).room;
              current=(await act(t1,"roll")).room;
              if(current.event.awaitingRolls)throw Error("Marine dice were not completed");
            }
            // No bids: close the auction and advance without exhausting the roster.
            for(let tries=0;current.auction.outcome===null&&tries<2;tries++){
              const seat=current.auction.turnId;
              current=(await act(seat===0?t0:t1,"pass")).room;
            }
            if(current.auction.outcome===null)throw Error("Could not settle round "+expectedRound);
          }
          if(!sawMystery||!sawEvent||schedule.type==="war"&&!sawWarSecond)
            throw Error("Not all independently planned surprises were exercised");
          const latest=await get(t1);
          if(latest.room.players.length!==2)throw Error("Lost guest");
          await request({action:"get",roomId,token:"f".repeat(64)},400);
          // Second room: test real paid bids and private Observation visions.
          const duo=await request({action:"create",name:"Bid Host",budget:"2000",teamSize:2,spoilers:false});
          const duoJoined=await request({action:"join",code:duo.room.code,name:"Bid Guest"});
          const d0=duo.token,d1=duoJoined.token,dRoomId=duo.room.id;
          const duoCall=(token,action,extra={})=>request({action,roomId:dRoomId,token,...extra});
          const duoStart=await duoCall(d0,"start");
          if(duoStart.room.event.awaitingRolls){
            await duoCall(d0,"roll");
            await duoCall(d1,"roll");
          }
          const starter=duoStart.room.auction.turnId;
          const first=starter===0?d0:d1,second=starter===0?d1:d0;
          const vision=await duoCall(first,"observation");
          if(!vision.room.players[starter].observationUsed||vision.room.peek.length!==3)throw Error("Observation not personal");
          const privateView=await duoCall(second,"get");
          if(privateView.room.peek.length!==0||JSON.stringify(privateView.room).includes("observationPeek"))
            throw Error("Observation leaked to another player");
          const min=duoStart.room.baseBid;
          await request({action:"bid",roomId:dRoomId,token:second,amount:min},400);
          const offered=await duoCall(first,"bid",{amount:min});
          if(offered.room.auction.leader!==starter||offered.room.auction.outcome!==null)
            throw Error("Bid or turn handling incorrect");
          const sold=await duoCall(second,"pass");
          if(sold.room.auction.outcome!=="sold")throw Error("Bid didn't settle");
          const winner=sold.room.players[starter];
          if(winner.roster.length!==1||BigInt(winner.budget)!==2000n+BigInt(winner.marineAward||"0")-BigInt(min))
            throw Error("Budget or recruitment incorrect");
          if(sold.room.players[1-starter].passesUsed!==0)
            throw Error("Passing after bid incorrectly consumed limited pass");
          // 4-player parity with the local mode: all slots join privately, only the host starts.
          const group=await request({action:"create",name:"Player 1",budget:"1000",teamSize:2,maxPlayers:4});
          const gRoom=group.room.id;
          const groupJoin=async(i)=>request({action:"join",code:group.room.code,name:"Player "+i});
          const g2=await groupJoin(2);
          await request({action:"start",roomId:gRoom,token:group.token},400);
          const g3=await groupJoin(3),g4=await groupJoin(4);
          if(g3.room.yourSeat!==2||g4.room.yourSeat!==3||g4.room.players.length!==4)
            throw Error("Multiplayer slots 3/4 failed");
          const guestReload=await request({action:"get",roomId:gRoom,token:g3.token});
          if(guestReload.room.yourSeat!==2)throw Error("Third player session identity failed");
          await request({action:"join",code:group.room.code,name:"Rejected guest"},400);
          const gStart=await request({action:"start",roomId:gRoom,token:group.token});
          if(gStart.room.status!=="playing"||gStart.room.players.length!==4)
            throw Error("Four-player start failed");
          // Check that separate games no longer all schedule their surprise on turn two.
          const eventRounds=new Set([eventAt]),mysteryRounds=new Set([mysteryAt]);
          for(let i=0;i<7;i++){
            const sample=(await request({action:"create",name:"Randomness "+i,budget:"1000",teamSize:5})).room.event;
            if(sample.eventRound===sample.mysteryRound||
               sample.type==="war"&&sample.mysteryRound===sample.eventRound+1)
              throw Error("Independent surprises overlapped");
            eventRounds.add(sample.eventRound);mysteryRounds.add(sample.mysteryRound);
          }
          if(eventRounds.size<2||mysteryRounds.size<2)
            throw Error("Event scheduling does not vary across games");
          console.log("PASS: variable and independent event / mystery timing, both surprise triggers, dice, war and 4-player sessions");
          console.log("PASS: private Observation, out-of-turn rejection, paid bid, budget, recruitment and free withdrawal");
          JS