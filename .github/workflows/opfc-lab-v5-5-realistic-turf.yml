name: OPFC — labo V5.5 pelouse réaliste (sans déploiement)
on:
  push:
    branches:
      - feature/opfc-lab-v5-5-realistic-pitch-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  turf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Empêcher tout changement du vrai OPFC et des moteurs
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- opfc.html opfc/ui.mjs opfc/ui-match.mjs opfc/ui-shootout.mjs opfc/penalty-scene.mjs opfc/penalty-scene.css opfc/penalty-lab-core.mjs opfc/penalty-lab-v4.mjs opfc/penalty-lab-v5-1.mjs opfc/penalty-lab-v5-1-flight.mjs opfc/penalty-lab-v5-2-net.mjs opfc/penalty.mjs opfc/shootout.mjs opfc/match.mjs opfc/stadiums.mjs opfc/penalty-lab-v5-3-backgrounds.css supabase
      - name: Syntaxe, perspective et stabilité du gazon
        run: |
          node --check opfc/penalty-lab-v5-5-turf.mjs
          node --check opfc/penalty-lab.mjs
          node --check opfc/tests/penalty-lab-v5-5-turf-browser.mjs
          node --test opfc/tests/penalty-lab-v5-5-turf.test.mjs opfc/tests/penalty-lab-v5-2-net.test.mjs opfc/tests/penalty-lab-v5-1-flight.test.mjs
      - name: Installer navigateur iPhone
        run: npm install --no-save playwright-core@1.57.0
      - name: Serveur isolé sans publication
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/opfc-v55-turf-server.log 2>&1 &
          sleep 2
      - name: Tester la pelouse sur iPhone et les 8 décors
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node opfc/tests/penalty-lab-v5-5-turf-browser.mjs
          node opfc/tests/penalty-lab-v5-4-all-stadiums-browser.mjs
          node opfc/tests/penalty-lab-v5-2-net-browser.mjs
      - name: Captures iPhone des terrains
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opfc-lab-v5-5-realistic-turf-iphone
          path: /tmp/opfc-v55-realistic-pitch-*-iphone.png
          if-no-files-found: ignore
          retention-days: 7
