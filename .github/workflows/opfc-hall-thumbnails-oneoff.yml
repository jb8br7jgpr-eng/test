name: OPFC Hall — One-off thumbnail generation
on:
  push:
    branches:
      - feature/opfc-hall-small-portraits-20261024
    paths:
      - '.github/workflows/opfc-hall-thumbnails-oneoff.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-hall-thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image optimizer
        run: python -m pip install --quiet pillow
      - name: Create 75 Hall-only 192px WebP portraits
        run: python scripts/create-opfc-hall-thumbnails.py
      - name: Commit only the new thumbnails on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opfc/hall-thumbs/
          if ! git diff --cached --quiet; then
            git commit -m "assets(opfc): 75 optimized Hall-only portraits"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
