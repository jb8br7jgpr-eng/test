name: OPFC - catalogue et moteur
on:
  push:
    branches: [opfc-development]
    paths:
      - 'opfc/**'
      - '.github/workflows/opfc-engine-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les règles OPFC
        run: node --test opfc/tests/*.test.mjs
