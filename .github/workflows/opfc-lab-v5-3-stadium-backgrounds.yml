name: OPFC — labo V5.3 deux décors de stade (sans déploiement)
on:
  push:
    branches:
      - feature/opfc-lab-v5-3-stadium-backdrops-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  background:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: OPFC jeu principal et moteurs inchangés
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- opfc.html opfc/ui.mjs opfc/ui-shootout.mjs opfc/ui-match.mjs opfc/penalty-scene.mjs opfc/penalty-scene.css opfc/penalty-lab-core.mjs opfc/penalty-lab-v4.mjs opfc/penalty-lab-v5-1.mjs opfc/penalty-lab-v5-1-flight.mjs opfc/penalty-lab-v5-2-net.mjs opfc/penalty-lab-visual.mjs opfc/penalty.mjs opfc/shootout.mjs opfc/match.mjs supabase
      - name: Images WebP déjà présentes
        run: |
          test -s opfc/assets/penalty-backgrounds/mugiwara.webp
          test -s opfc/assets/penalty-backgrounds/wanodrome.webp
          node --check opfc/penalty-lab.mjs
          node --check opfc/tests/penalty-lab-v5-3-backgrounds-browser.mjs
          node --test opfc/tests/penalty-lab-v5-2-net.test.mjs opfc/tests/penalty-lab-v5-1-flight.test.mjs
      - name: Navigateur de contrôle
        run: npm install --no-save playwright-core@1.57.0
      - name: Serveur isolé sans publication
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/opfc-lab-v53-server.log 2>&1 &
          sleep 2
      - name: Tester les deux arrière-plans et les animations sur iPhone
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node opfc/tests/penalty-lab-v5-3-backgrounds-browser.mjs
          node opfc/tests/penalty-lab-v5-2-net-browser.mjs
      - name: Captures iPhone avec illustrations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opfc-labo-v53-mugiwara-wanodrome-iphone
          path: |
            /tmp/opfc-v53-decor-*-iphone.png
          if-no-files-found: ignore
          retention-days: 7
