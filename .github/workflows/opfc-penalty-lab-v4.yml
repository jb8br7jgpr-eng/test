name: OPFC — laboratoire V4 (sans déploiement)
on:
  push:
    branches:
      - feature/opfc-penalty-lab-v4-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Intégrité de la production et des moteurs
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- opfc.html opfc/ui.mjs opfc/penalty-scene.mjs opfc/penalty-scene.css opfc/penalty-lab-core.mjs opfc/penalty-lab-visual.mjs opfc/penalty.mjs opfc/shootout.mjs opfc/match.mjs opfc/ui-final.mjs opfc/ui-match-widgets.mjs supabase
      - name: Vérification JavaScript
        run: |
          node --check opfc/penalty-lab-v4.mjs
          node --check opfc/penalty-lab.mjs
          node --check opfc/tests/penalty-lab-v4.test.mjs
          node --check opfc/tests/penalty-lab-v4-browser.mjs
      - name: Tests fonctionnels et compatibilité moteur
        run: |
          node --test opfc/tests/penalty-lab-v4.test.mjs
      - name: Installer navigateur de test
        run: npm install --no-save playwright-core@1.57.0
      - name: Serveur local isolé
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/opfc-lab-v4-server.log 2>&1 &
          sleep 2
      - name: 'Parcours iPhone : buts, arrêts, ratés et TAB'
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: node opfc/tests/penalty-lab-v4-browser.mjs
      - name: Aperçu visuel de la branche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opfc-penalty-lab-v4-iphone
          path: /tmp/opfc-lab-v4-iphone.png
          if-no-files-found: ignore
          retention-days: 7
