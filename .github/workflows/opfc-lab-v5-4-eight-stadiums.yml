name: OPFC — labo V5.4 huit décors WebP (sans déploiement)
on:
  push:
    branches:
      - feature/opfc-lab-v5-4-eight-backdrops-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backgrounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Garantir que le vrai jeu OPFC et ses moteurs sont intacts
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main...HEAD -- opfc.html opfc/ui.mjs opfc/ui-match.mjs opfc/ui-shootout.mjs opfc/penalty-scene.mjs opfc/penalty-scene.css opfc/penalty-lab-core.mjs opfc/penalty-lab-v4.mjs opfc/penalty-lab-v5-1.mjs opfc/penalty-lab-v5-1-flight.mjs opfc/penalty-lab-v5-2-net.mjs opfc/penalty.mjs opfc/shootout.mjs opfc/match.mjs supabase
      - name: Vérifier les huit images et la syntaxe
        run: |
          for stadium in mugiwara wanodrome erbaf skypiea alabasta marineford dressrosa whole-cake; do
            test -s "opfc/assets/penalty-backgrounds/$stadium.webp"
          done
          node --check opfc/penalty-lab.mjs
          node --check opfc/tests/penalty-lab-v5-4-all-stadiums-browser.mjs
          node --test opfc/tests/penalty-lab-v5-2-net.test.mjs opfc/tests/penalty-lab-v5-1-flight.test.mjs
      - name: Installer le navigateur iPhone simulé
        run: npm install --no-save playwright-core@1.57.0
      - name: Serveur local de la branche de laboratoire
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/opfc-v54-server.log 2>&1 &
          sleep 2
      - name: Tester les 8 panoramas et les animations sur iPhone
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node opfc/tests/penalty-lab-v5-4-all-stadiums-browser.mjs
          node opfc/tests/penalty-lab-v5-2-net-browser.mjs
      - name: Captures iPhone des 8 stades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opfc-lab-v5-4-eight-stadiums-iphone
          path: /tmp/opfc-v54-*-iphone.png
          if-no-files-found: ignore
          retention-days: 7
